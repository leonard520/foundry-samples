# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'

name: agent-framework-agent-basic-responses-byoaks

infra:
  provider: microsoft.foundry

services:
  ai-project:
    host: azure.ai.project
    agentHosting:
      hostingType: ManagedCluster
      name: primary
      clusterResourceId: ${AKS_RESOURCE_ID}
      agentSubnetResourceId: ${AGENT_SUBNET_RESOURCE_ID}
      hostingManagementIdentityResourceId: ${HOSTING_IDENTITY_RESOURCE_ID}
      storageAccountResourceId: ${STORAGE_ACCOUNT_RESOURCE_ID}
      workloadIdentityResourceId: ${WORKLOAD_IDENTITY_RESOURCE_ID}
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10

  agent-framework-agent-basic-responses-byoaks:
    project: src/agent-framework-agent-basic-responses
    host: azure.ai.agent
    language: docker
    docker:
      path: ./Dockerfile
      context: .
      platform: linux/amd64
      remoteBuild: true
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - BYO AKS
        - Responses Protocol
        - Streaming
    uses:
      - ai-project
    kind: hosted
    name: agent-framework-agent-basic-responses-byoaks
    description: A basic Agent Framework Responses agent hosted on a customer-managed AKS cluster.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
